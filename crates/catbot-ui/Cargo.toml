[package]
name = "catbot-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Catbot's interface, in Dioxus. Built with `dx`, served by `catbot serve`."
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = [] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
