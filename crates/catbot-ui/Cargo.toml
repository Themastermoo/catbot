[package]
name = "catbot-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Catbot's interface, in Dioxus: in a browser (served by `catbot serve`) or as the desktop app."
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = [] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
pulldown-cmark = { version = "0.13", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In a browser: the browser's own clock, fetch and event stream.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }

# In the desktop app: the same, natively.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls"] }
base64 = "0.22"
tokio = { version = "1", features = ["time"] }
# Desktop notifications (Linux and Windows apps only).
notify-rust = { version = "4", optional = true }

# The desktop pets see where the windows are: through a KWin script on KDE Plasma (D-Bus), and
# from Windows itself (pet_tops.rs). Both already in the build, through notify-rust and tao.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", optional = true, default-features = false, features = ["default-rt", "service"] }
# The window's own web view, to let voice use the microphone (it's off by default there). The
# same version the window already uses, through wry.
webkit2gtk = { version = "=2.0.1", optional = true, features = ["v2_38"] }

# The phone app runs its own Catbot inside it (stage 26): the same server, as a library.
[target.'cfg(target_os = "android")'.dependencies]
catbot = { path = "../catbot" }
tokio = { version = "1", features = ["time", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop", "dep:notify-rust", "dep:zbus", "dep:webkit2gtk", "dep:windows-sys"]
mobile = ["dioxus/mobile"]
