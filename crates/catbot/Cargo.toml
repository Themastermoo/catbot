[package]
name = "catbot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Catbot server. For now: a pass-through recorder in front of the reference server."

[dependencies]
axum = "0.8"
bytes = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
base64 = "0.22"
# Turns the SVG drawings Claude makes into pictures.
resvg = "0.45"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls"] }
# Reads and writes the YAML at the top of a team file (MausBot's portable format).
serde_yaml_ng = "0.10"
# The person's mailbox (stage 13.9): IMAP over TLS, and reading the messages.
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
mail-parser = "0.11"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }

[dev-dependencies]
tempfile = "3"
