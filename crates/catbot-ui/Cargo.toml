[package]
name = "catbot-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Catbot's interface, in Dioxus: in a browser (served by `catbot serve`) or as the desktop app."
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = [] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
pulldown-cmark = { version = "0.13", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In a browser: the browser's own clock, fetch and event stream.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json", "eventsource"] }
gloo-timers = { version = "0.3", features = ["futures"] }

# In the desktop app: the same, natively.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
